<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gemini-web2api 管理面板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #1a1f29; --border: #2a3140;
    --text: #d8dde6; --muted: #8993a8; --accent: #4f9eff;
    --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px; }
  header { background: var(--panel); border-bottom: 1px solid var(--border);
           padding: 12px 24px; display: flex; align-items: center;
           justify-content: space-between; }
  header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
  nav { display: flex; gap: 8px; }
  nav button { background: transparent; border: 1px solid var(--border); color: var(--text);
               padding: 6px 14px; cursor: pointer; border-radius: 6px;
               font-size: 13px; transition: all .15s; }
  nav button:hover { border-color: var(--accent); color: var(--accent); }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
             gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
         padding: 14px 18px; }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase;
                letter-spacing: 0.5px; margin-bottom: 6px; }
  .kpi .value { font-size: 22px; font-weight: 600; color: var(--text); }
  .kpi .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
           padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin-bottom: 14px; color: var(--text);
              display: flex; justify-content: space-between; align-items: center; }
  .panel h2 .controls { display: flex; gap: 8px; }
  .panel h2 .controls button, .panel h2 .controls select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase;
       background: rgba(0,0,0,0.15); }
  tr:hover td { background: rgba(79, 158, 255, 0.04); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.ok { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge.fail { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge.muted { background: rgba(137,147,168,0.15); color: var(--muted); }
  .pre { font-family: "Consolas", "Menlo", monospace; font-size: 11.5px;
         color: var(--muted); white-space: pre-wrap; max-width: 360px;
         overflow: hidden; text-overflow: ellipsis; }
  button.btn { background: var(--accent); color: #fff; border: none;
               padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button.btn:hover { opacity: 0.9; }
  button.btn.danger { background: var(--red); }
  button.btn.muted { background: var(--border); color: var(--text); }
  input, select { background: var(--bg); border: 1px solid var(--border);
                  color: var(--text); padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  .login-box { max-width: 380px; margin: 100px auto; background: var(--panel);
               border: 1px solid var(--border); border-radius: 8px; padding: 32px; }
  .login-box h1 { color: var(--accent); margin-bottom: 20px; font-size: 20px; }
  .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; }
  .login-box button { width: 100%; padding: 10px; }
  .err { color: var(--red); font-size: 12px; margin-top: 8px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  canvas { width: 100% !important; max-height: 320px; }
  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 13px; }
  .truncate { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details summary { cursor: pointer; color: var(--accent); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  /* 自定义弹窗 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; backdrop-filter: blur(2px);
    animation: fade-in .15s ease-out;
  }
  @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; min-width: 420px; max-width: 560px;
    padding: 24px; box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    animation: pop-in .18s ease-out;
  }
  @keyframes pop-in { from { transform: scale(.96); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .modal h3 { font-size: 15px; margin-bottom: 6px; color: var(--text); }
  .modal .desc { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; line-height: 1.5; }
  .modal .field { margin-bottom: 14px; }
  .modal .field label {
    display: block; color: var(--muted); font-size: 11.5px;
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .modal .field input, .modal .field textarea {
    width: 100%; padding: 9px 11px; font-size: 13px;
    font-family: "Consolas", "Menlo", monospace;
  }
  .modal .field .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .modal .actions button { padding: 8px 18px; font-size: 13px; }
  .modal .err {
    background: rgba(248,113,113,0.1); border-left: 3px solid var(--red);
    padding: 8px 12px; color: var(--red); font-size: 12px; margin-bottom: 12px;
    border-radius: 4px;
  }

.rtrow { display: grid; grid-template-columns: 150px 200px 1fr; gap: 10px;
         align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
.rtrow:last-child { border-bottom: none; }
.rtrow label { color: var(--fg); font-size: 13px; }
.rtrow input[type=text], .rtrow input[type=number], .rtrow select {
  width: 100%; padding: 5px 8px; background: var(--bg2); color: var(--fg);
  border: 1px solid var(--border); border-radius: 5px; font-size: 13px; }
.rtrow input[type=checkbox] { width: 16px; height: 16px; }
.rthint { color: var(--muted); font-size: 12px; }
@media (max-width: 760px) { .rtrow { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const api = async (path, opts = {}) => {
  const r = await fetch(path, { credentials: 'include', ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { renderLogin(); throw new Error('unauthorized'); }
  return r.json();
};

const fmt = {
  ts: (sec) => new Date(sec * 1000).toLocaleString('zh-CN', { hour12: false }),
  ms: (ms) => ms == null ? '-' : (ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(2) + 's'),
  num: (n) => (n || 0).toLocaleString(),
  pct: (n) => (n * 100).toFixed(1) + '%',
};

let charts = {};
const destroyChart = (key) => { if (charts[key]) { charts[key].destroy(); delete charts[key]; } };

// ─── Pages ──────────────────────────────────────────────────────────────────

const pages = {
  dashboard: async () => {
    const stats = await api('/admin/api/stats?hours=24');
    const usage = await api('/admin/api/usage');
    return `
      <div class="kpi-row">
        <div class="kpi"><div class="label">24 小时请求数</div><div class="value">${fmt.num(stats.total_requests)}</div></div>
        <div class="kpi"><div class="label">成功率</div><div class="value">${fmt.pct(stats.success_rate)}</div>
          <div class="sub">${fmt.num(stats.success)} 成功 / ${fmt.num(stats.failures)} 失败</div></div>
        <div class="kpi"><div class="label">平均延迟</div><div class="value">${fmt.ms(stats.avg_ms)}</div></div>
        <div class="kpi"><div class="label">输入 Token</div><div class="value">${fmt.num(stats.prompt_tokens)}</div></div>
        <div class="kpi"><div class="label">输出 Token</div><div class="value">${fmt.num(stats.output_tokens)}</div></div>
      </div>
      <div class="panel">
        <h2>请求量与延迟趋势
          <span class="controls">
            <select id="rangeSel">
              <option value="24h">最近 24 小时</option>
              <option value="7d">最近 7 天</option>
              <option value="30d">最近 30 天</option>
            </select>
          </span>
        </h2>
        <canvas id="chartReq"></canvas>
      </div>
      <div class="panel">
        <h2>连通性诊断
          <span class="controls">
            <select id="testProxy"><option value="">自动选择（按调度规则）</option><option value="0">直连主机 IP</option></select>
            <button class="btn" onclick="runTest()">测试一次</button>
          </span>
        </h2>
        <p style="color: var(--muted); font-size: 12.5px; margin-bottom: 10px; line-height: 1.6;">
          打一次真实 Gemini 请求看是否通。<b>不消耗限流配额、不写入请求记录</b>，
          专门用来排查 IP 是不是被 Google 风控了。返回 302/429 都是 IP 黑名单
          信号 → 该换 IP 或加代理。
        </p>
        <div id="testResult" style="display:none;"></div>
      </div>
      <div class="panel">
        <h2>IP 限流用量
          <span class="controls"><button onclick="switchPage('dashboard')">刷新</button></span>
        </h2>
        <p style="color: var(--muted); font-size: 12px; margin-bottom: 10px;">
          每个 IP slot（直连或单个代理）独立计数。当前限额：并发 ${(usage.items[0]||{}).limit_concurrent || '-'} / RPM ${(usage.items[0]||{}).limit_rpm || '-'} / RPH ${(usage.items[0]||{}).limit_rph || '-'}
        </p>
        <div style="background: rgba(251,191,36,0.08); border-left: 3px solid var(--yellow); padding: 10px 14px; margin-bottom: 14px; font-size: 12.5px; line-height: 1.6; color: var(--text);">
          <b style="color: var(--yellow);">⚠ 为什么要限流</b><br>
          实测单 IP 累积约 100 次请求会被 Google 重定向到 <code>google.com/sorry/index</code>，
          所有后续请求 6-24 小时内全部失败，只能等待或换 IP 才能恢复。<br>
          本地限流主动拦下超量请求 → 返回 <b>HTTP 429</b>（不消耗 Google 配额），
          请求被推迟到 slot 有空位再发。<br><br>
          <b>每个 IP slot 独立计数：</b>直连 = 主机 IP 一个 slot；每个代理一个 slot。
          <b>配越多代理 → 总容量线性放大</b>（5 代理 = 5 倍并发/RPM/RPH 总容量）。<br>
          配置代理在「代理池」页面，限额改 <code>config.json</code> 的
          <code>per_ip_concurrent</code> / <code>per_ip_rpm</code> / <code>per_ip_rph</code> 后重启即可。
        </div>
        <table>
          <thead><tr><th>IP slot</th><th>并发</th><th>RPM</th><th>RPH</th><th>占用率（最严的那项）</th></tr></thead>
          <tbody>${(usage.items || []).map(u => {
            const cc = u.limit_concurrent ? u.inflight / u.limit_concurrent : 0;
            const cm = u.limit_rpm ? u.rpm / u.limit_rpm : 0;
            const ch = u.limit_rph ? u.rph / u.limit_rph : 0;
            const top = Math.max(cc, cm, ch);
            const cls = top >= 0.9 ? 'fail' : top >= 0.6 ? 'muted' : 'ok';
            const label = top >= 0.9 ? '接近上限' : top >= 0.6 ? '使用中' : '空闲';
            return `<tr>
              <td><b>${u.name}</b></td>
              <td>${u.inflight} / ${u.limit_concurrent || '∞'}</td>
              <td>${u.rpm} / ${u.limit_rpm || '∞'}</td>
              <td>${u.rph} / ${u.limit_rph || '∞'}</td>
              <td><span class="badge ${cls}">${(top*100).toFixed(0)}% · ${label}</span></td>
            </tr>`;
          }).join('') || '<tr><td colspan="5" class="empty">还没有任何请求经过</td></tr>'}
          </tbody>
        </table>
      </div>
      <div class="grid-2">
        <div class="panel">
          <h2>按模型分组</h2>
          <table>
            <thead><tr><th>模型</th><th>请求</th><th>成功</th><th>平均</th><th>Token 合计</th></tr></thead>
            <tbody>${(stats.by_model || []).map(m => `
              <tr><td>${m.model}</td><td>${fmt.num(m.requests)}</td>
                  <td>${fmt.num(m.success)}</td><td>${fmt.ms(m.avg_ms)}</td>
                  <td>${fmt.num(m.prompt_tokens + m.output_tokens)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">暂无数据</td></tr>'}
            </tbody>
          </table>
        </div>
        <div class="panel">
          <h2>按代理分组</h2>
          <table>
            <thead><tr><th>代理</th><th>请求</th><th>成功</th><th>平均</th></tr></thead>
            <tbody>${(stats.by_proxy || []).map(p => `
              <tr><td>${p.proxy === '(direct)' ? '直连' : p.proxy}</td><td>${fmt.num(p.requests)}</td>
                  <td>${fmt.num(p.success)}</td><td>${fmt.ms(p.avg_ms)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">暂无数据</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  },

  requests: async () => {
    return `
      <div class="panel">
        <h2>请求记录
          <span class="controls">
            <select id="reqStatus">
              <option value="">全部</option>
              <option value="ok">成功</option>
              <option value="fail">失败</option>
            </select>
            <select id="reqModel"><option value="">全部模型</option></select>
            <button onclick="loadReqs()">刷新</button>
          </span>
        </h2>
        <table id="reqTable">
          <thead><tr>
            <th>时间</th><th>模型</th><th>实际模型</th><th>代理</th><th>状态</th>
            <th>首字延迟</th><th>总用时</th><th>输入 Token</th><th>输出 Token</th><th>接口</th>
          </tr></thead>
          <tbody><tr><td colspan="9" class="empty">加载中...</td></tr></tbody>
        </table>
        <div style="margin-top: 12px; text-align: center;" id="reqPager"></div>
      </div>
    `;
  },

  proxies: async () => {
    const data = await api('/admin/api/proxies');
    return `
      <div class="panel">
        <h2>代理池
          <span class="controls"><button class="btn" onclick="addProxy()">+ 添加代理</button></span>
        </h2>
        <p style="color: var(--muted); font-size: 12.5px; margin-bottom: 14px; line-height: 1.6;">
          每个代理是一个独立的 IP slot，享有独立的并发/RPM/RPH 配额。
          <b>配越多代理 → 总容量线性放大</b>。请求会自动找有空位的代理；都满 → 返回 HTTP 429。
          失败 5 次自动熔断（"重置"按钮可手动恢复）。<br>
          <span style="color: var(--yellow);">注意：</span>
          配了至少一个代理后，<b>不会再退回直连</b>（避免代理满了把主机 IP 也打爆）。
        </p>
        <table>
          <thead><tr>
            <th>ID</th><th>名称</th><th>代理 URL</th><th>状态</th>
            <th>失败次数</th><th>最近错误</th><th>操作</th>
          </tr></thead>
          <tbody>${(data.items || []).map(p => `
            <tr>
              <td>${p.id}</td>
              <td>${p.name}</td>
              <td class="pre truncate">${p.url}</td>
              <td>${p.enabled ? '<span class="badge ok">已启用</span>' : '<span class="badge muted">已禁用</span>'}</td>
              <td>${p.fail_count > 0 ? '<span class="badge fail">' + p.fail_count + '</span>' : p.fail_count}</td>
              <td class="pre truncate">${p.last_error || '-'}</td>
              <td>
                <button class="btn muted" onclick="toggleProxy(${p.id})">${p.enabled ? '禁用' : '启用'}</button>
                <button class="btn muted" onclick="resetProxy(${p.id})">重置</button>
                <button class="btn danger" onclick="delProxy(${p.id})">删除</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="7" class="empty">还没有代理。点击"+ 添加代理"添加。</td></tr>'}
        </tbody>
      </table>
      </div>
    `;
  },

  settings: async () => {
    const k = await api('/admin/api/apikey');
    const usage = await api('/admin/api/usage');
    const limits = (usage.items[0] || {});
    return `
      <div class="panel">
        <h2>API Key（用于 /v1/* 接口鉴权）</h2>
        <p style="color: var(--muted); margin-bottom: 12px; font-size: 12.5px;">
          ${k.locked
            ? '已被启动参数 <code>--api-key</code> 或环境变量 <code>API_KEY</code> 锁定，需修改部署配置才能更换。'
            : '可在线管理 — 重新生成或自定义。'}
        </p>
        <div class="row" style="margin-bottom: 14px;">
          <input id="apiKeyView" type="password" value="${escapeHtml(k.key)}"
                 style="flex: 1; min-width: 320px; font-family: 'Consolas', monospace;" readonly />
          <button class="btn muted" onclick="toggleKeyVis()">显示</button>
          <button class="btn muted" onclick="copyKey()">复制</button>
        </div>
        ${k.locked ? '' : `
          <div class="row">
            <button class="btn" onclick="rotateKey()">生成随机 Key</button>
            <button class="btn muted" onclick="customKey()">自定义 Key</button>
          </div>
        `}
        <div style="margin-top: 16px; padding: 12px; background: var(--bg); border-radius: 6px;">
          <div style="color: var(--muted); font-size: 12px; margin-bottom: 6px;">使用示例：</div>
          <pre class="pre" style="margin: 0; font-size: 12px;">curl http://your-host/v1/chat/completions \\
  -H "Authorization: Bearer YOUR_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{"model":"gemini-3.5-flash","messages":[{"role":"user","content":"你好"}]}'</pre>
        </div>
      </div>
      <div class="panel">
        <h2>运行时配置</h2>
        <p style="color: var(--muted); margin-bottom: 12px; font-size: 12.5px;">
          改完点保存<b>立刻生效</b>，不用重启。存在数据库里，优先级高于 <code>config.json</code> 和命令行参数。
        </p>
        <div id="rtCfgForm"></div>
        <div style="margin-top: 14px; display: flex; gap: 8px; align-items: center;">
          <button class="btn" onclick="saveRtCfg()">保存并生效</button>
          <button class="btn muted" onclick="loadRtCfg()">放弃修改</button>
          <span id="rtCfgMsg" style="font-size: 12.5px;"></span>
        </div>
        <p style="color: var(--muted); margin-top: 14px; font-size: 12px;">
          实测：单 IP 累积约 100 次请求会触发 Google 拦截 6-24 小时。默认 RPH=80 留 20% 余量。
          要支撑更高产能 → 在「代理池」页面加代理（每个代理是独立的 slot）。
        </p>
      </div>

      <div class="card">
        <h2>部署配置（只读）</h2>
        <p style="color: var(--muted); margin-bottom: 12px; font-size: 12.5px;">
          这些改了本来就要重启进程，所以放在 <code>docker-compose.yml</code> 里管，
          不做成网页表单——凭证也不该经过浏览器。
        </p>
        <table id="deployTable">
          <thead><tr><th>项</th><th>当前值</th><th>怎么改</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="panel">
        <h2>会话</h2>
        <p>当前以 cookie 会话登录。</p>
        <button class="btn danger" onclick="doLogout()">退出登录</button>
      </div>
      <div class="panel">
        <h2>关于</h2>
        <p>gemini-web2api-go 管理面板 · 单二进制 · SQLite + Chrome 146 指纹模拟 · tiktoken cl100k_base 计算 token。</p>
      </div>
    `;
  },
};

// ─── Charts + handlers ──────────────────────────────────────────────────────

async function loadChart(range = '24h') {
  destroyChart('req');
  const data = await api('/admin/api/timeseries?range=' + range);
  const labels = (data.series || []).map(s => fmt.ts(s.bucket));
  const reqs = (data.series || []).map(s => s.requests);
  const p50 = (data.series || []).map(s => s.p50_ms);
  const ctx = document.getElementById('chartReq');
  if (!ctx) return;
  charts.req = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '请求数', data: reqs, borderColor: '#4f9eff',
          backgroundColor: 'rgba(79,158,255,0.1)', yAxisID: 'y', tension: 0.3 },
        { label: 'P50 延迟 (ms)', data: p50, borderColor: '#fbbf24',

let reqOffset = 0;
const REQ_PAGE = 50;
async function loadReqs() {
  const status = document.getElementById('reqStatus')?.value || '';
  const model = document.getElementById('reqModel')?.value || '';
  const url = `/admin/api/requests?limit=${REQ_PAGE}&offset=${reqOffset}` +
              (status ? '&status=' + status : '') +
              (model ? '&model=' + encodeURIComponent(model) : '');
  const data = await api(url);
  const tbody = document.querySelector('#reqTable tbody');
  if (!tbody) return;
  tbody.innerHTML = (data.items || []).map(r => `
    <tr>
      <td>${fmt.ts(r.ts)}</td>
      <td>${r.model}</td>
      <td>${upstreamCell(r)}</td>
      <td>${r.proxy_name || '<span class="badge muted">直连</span>'}</td>
      <td>${r.status === 200 ? '<span class="badge ok">200</span>' : '<span class="badge fail">' + r.status + '</span>'}</td>
      <td>${fmt.ms(r.ttfb_ms)}</td>
      <td>${fmt.ms(r.total_ms)}</td>
      <td>${fmt.num(r.prompt_tokens)}</td>
      <td>${fmt.num(r.output_tokens)}</td>
      <td><span class="pre">${escapeHtml(r.endpoint)}${r.stream ? ' <span class="badge muted">stream</span>' : ''}</span>
        ${r.error ? '<div class="pre" style="color:#f87171; margin-top:4px"><b>错误：</b> ' + escapeHtml(r.error) + '</div>' : ''}
      </td>
    </tr>`).join('') || '<tr><td colspan="9" class="empty">还没有请求记录</td></tr>';
  document.getElementById('reqPager').innerHTML = `
    <button class="btn muted" ${reqOffset === 0 ? 'disabled' : ''} onclick="reqOffset=Math.max(0,reqOffset-${REQ_PAGE});loadReqs()">← 上一页</button>
    <span style="margin: 0 12px; color: var(--muted)">${reqOffset+1}-${Math.min(reqOffset+REQ_PAGE, data.total)} / 共 ${data.total} 条</span>
    <button class="btn muted" ${reqOffset+REQ_PAGE >= data.total ? 'disabled' : ''} onclick="reqOffset+=${REQ_PAGE};loadReqs()">下一页 →</button>
  `;
  // populate model dropdown from current page (best-effort)
  const sel = document.getElementById('reqModel');
  if (sel && sel.options.length === 1) {
    const seen = new Set();
    (data.items || []).forEach(r => seen.add(r.model));
    [...seen].forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.text = m; sel.appendChild(opt);
    });
  }
}

let rtCfgCache = null, rtModels = [];

async function loadRtCfg() {
  const data = await api('/admin/api/config');

  rtCfgCache = data.config; rtModels = data.models || [];
  document.getElementById('rtCfgForm').innerHTML = RT_FIELDS.map(f => {

    let input;

      input = `<input type="checkbox" id="rt_${f.k}" ${v ? 'checked' : ''}>`;
    } else if (f.type === 'select') {

    } else if (f.type === 'int') {
      input = `<input type="number" id="rt_${f.k}" value="${v}" min="${f.min}" max="${f.max}">`;

async function saveRtCfg() {
  const msg = document.getElementById('rtCfgMsg');
  const body = {};
  for (const f of RT_FIELDS) {
    const el = document.getElementById('rt_' + f.k);
    if (!el) continue;
    body[f.k] = f.type === 'bool' ? el.checked
      : f.type === 'int' ? parseInt(el.value, 10)
      : el.value.trim();
  }
  msg.textContent = '保存中…'; msg.style.color = 'var(--muted)';
  const res = await fetch('/admin/api/config', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    msg.textContent = '保存失败：' + (data.error || res.status);
    msg.style.color = '#f87171';
    return;
  }
  rtCfgCache = data.config;
  msg.textContent = '已保存并生效';
  msg.style.color = '#4ade80';
  setTimeout(() => { msg.textContent = ''; }, 3000);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 服务端会静默降级（例如请求 3.1 Pro 实际给的是 3.6 Flash），只看请求名发现不了。
// upstream_model 取自响应帧里服务端自报的显示名；跟请求的对不上时标黄。
function upstreamCell(r) {
  const up = r.upstream_model || '';
  if (!up) return '<span class="badge muted">—</span>';
  const norm = t => (t || '').toLowerCase().replace(/[\s._-]/g, '').replace(/^gemini/, '');
  const same = norm(up).startsWith(norm(r.model).slice(0, 6));
  return same
    ? escapeHtml(up)
    : '<span class="badge" style="background:#78350f;color:#fcd34d" title="服务端实际使用的模型与请求的不一致">'
      + escapeHtml(up) + '</span>';
}

// 自定义弹窗 ──────────────────────────────────────────────────────────────
//   modalConfirm({ title, desc, confirmText, danger })       -> bool
//   modalPrompt({ title, desc, label, placeholder, value })   -> string|null
//   modalForm({ title, desc, fields: [{name,label,...}], submitText })
//                                                            -> obj|null

function buildModal({ title, desc, bodyHTML, submitText, danger, allowEnter, onSubmit }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        ${title ? `<h3>${escapeHtml(title)}</h3>` : ''}
        ${desc ? `<div class="desc">${desc}</div>` : ''}
        <div class="modal-err" style="display:none;"></div>
        <div class="modal-body">${bodyHTML || ''}</div>
        <div class="actions">
          <button class="btn muted" data-act="cancel">取消</button>
          <button class="btn ${danger ? 'danger' : ''}" data-act="ok">${escapeHtml(submitText || '确定')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const finish = (val) => {
      overlay.remove();
      document.removeEventListener('keydown', keyHandler);
      resolve(val);
    };
    const showErr = (msg) => {
      const e = overlay.querySelector('.modal-err');
      e.textContent = msg;
      e.style.display = msg ? 'block' : 'none';
      e.className = 'modal-err err';
    };

    overlay.querySelector('[data-act=cancel]').onclick = () => finish(null);
    overlay.querySelector('[data-act=ok]').onclick = async () => {
      const result = onSubmit ? await onSubmit(overlay) : true;
      if (result === false) return; // validation failed
      if (result && typeof result === 'object' && result.error) { showErr(result.error); return; }
      finish(result === true ? true : result);
    };
    overlay.onclick = (e) => { if (e.target === overlay) finish(null); };

    const keyHandler = (e) => {
      if (e.key === 'Escape') finish(null);
      if (e.key === 'Enter' && allowEnter && document.activeElement.tagName !== 'TEXTAREA') {
        overlay.querySelector('[data-act=ok]').click();
      }
    };
    document.addEventListener('keydown', keyHandler);

    // 自动 focus 第一个 input
    setTimeout(() => {
      const first = overlay.querySelector('input,textarea');
      if (first) first.focus();
    }, 50);
  });
}

function modalConfirm({ title, desc, confirmText = '确定', danger = false }) {
  return buildModal({
    title, desc, bodyHTML: '', submitText: confirmText, danger, allowEnter: true,
    onSubmit: () => true,
  });
}

function modalPrompt({ title, desc, label, placeholder = '', value = '', hint, password = false }) {
  return buildModal({
    title, desc, allowEnter: true,
    bodyHTML: `<div class="field">
      ${label ? `<label>${escapeHtml(label)}</label>` : ''}
      <input type="${password ? 'password' : 'text'}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(value)}" />
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>`,
    submitText: '确定',
    onSubmit: (overlay) => {
      const v = overlay.querySelector('input').value;
      if (!v) return { error: '不能为空' };
      return v;
    },
  });
}

// fields: [{ name, label, placeholder, hint, value, required, password }]
function modalForm({ title, desc, fields, submitText = '提交' }) {
  const html = fields.map(f => `
    <div class="field">
      <label>${escapeHtml(f.label)}${f.required ? ' *' : ''}</label>
      <input data-name="${escapeHtml(f.name)}" type="${f.password ? 'password' : 'text'}"
             placeholder="${escapeHtml(f.placeholder || '')}"
             value="${escapeHtml(f.value || '')}" />
      ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}
    </div>`).join('');
  return buildModal({
    title, desc, bodyHTML: html, submitText, allowEnter: true,
    onSubmit: (overlay) => {
      const out = {};
      for (const f of fields) {
        const el = overlay.querySelector(`[data-name="${f.name}"]`);
        const v = (el.value || '').trim();
        if (f.required && !v) return { error: `「${f.label}」不能为空` };
        if (f.minLength && v.length < f.minLength) return { error: `「${f.label}」至少 ${f.minLength} 字符` };
        out[f.name] = v;
      }
      return out;
    },
  });
}

async function switchPage(name) {
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.page === name));
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">加载中...</div>';
  try {
    main.innerHTML = await pages[name]();
  } catch (e) {
    main.innerHTML = '<div class="empty">' + e.message + '</div>'; return;
  }
  if (name === 'dashboard') {
    await loadChart('24h');
    document.getElementById('rangeSel').onchange = (e) => loadChart(e.target.value);
    await populateTestProxies();
  }
  if (name === 'requests') {
    reqOffset = 0;
    document.getElementById('reqStatus').onchange = () => { reqOffset = 0; loadReqs(); };
    await loadReqs();
  }
  if (name === 'settings') {
    await loadRtCfg();
  }
}

    body: JSON.stringify({ token: tok }) });
  if (r.ok) renderShell();
  else document.getElementById('loginErr').textContent = 'Token 错误';
}

// boot — try fetching stats; if 401, login page
(async () => {
  const r = await fetch('/admin/api/stats?hours=1', { credentials: 'include' });
  if (r.ok) renderShell();
  else renderLogin();
})();
</script>
</body>
</html>
