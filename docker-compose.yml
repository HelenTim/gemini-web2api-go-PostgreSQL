services:
  gemini-web2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemini-web2api-go:latest
    container_name: gemini-web2api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8083:8083"
    # 想暴露给同 docker network 的其他容器（不走公网），改用:
    # expose:
    #   - "8083"
    # 然后让其他容器加入下面的 default network 或自定义 network。

    volumes:
      - ./data:/data                              # SQLite + 历史记录持久化
      - ./config.json:/app/config.json:ro         # 可选,启动时优先读
      # - ./cookie.txt:/app/cookie.txt:ro         # 可选,Pro 模型挂 Google 账号 cookie

    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-in-production}"
      # API_KEY: ""                               # 可选,锁定 /v1/* API key
      TZ: "${TZ:-UTC}"

    command:
      - "--db"
      - "/data/gemini.db"
      - "--port"
      - "8083"

    healthcheck:
      test: ["CMD", "/app/gemini-web2api", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
