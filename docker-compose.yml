services:
  gemini-web2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemini-web2api-go:latest
    container_name: gemini-web2api
    restart: unless-stopped

    # ── 部署期配置全在这个文件里 ──────────────────────────────────────────
    # 调优参数（限流额度、重试、超时、默认模型、TLS 指纹、bl 版本、静态代理、
    # 日志开关、数据保留天数）**不在这里配** —— 那些在管理面板
    # 「设置 → 运行时配置」里改，保存即生效、不用重启。
    # 这里只放两类：改了必须重启进程的，以及不该经过浏览器表单的凭证。

    ports:
      - "127.0.0.1:8083:8083"
    # 想暴露给同 docker network 的其他容器（不走公网），改用:
    # expose:
    #   - "8083"
    # 然后让其他容器加入下面的 default network 或自定义 network。

    volumes:
      - ./data:/data                              # SQLite + 历史记录持久化
      # - ./cookie.txt:/app/cookie.txt:ro         # 挂 Google 账号 cookie；挂了才会暴露 gemini-3.1-pro

    environment:
      # 面板登录 token。留空 = 面板不鉴权，只有在绑定 127.0.0.1 时才可接受。
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-in-production}"
      # 锁定 /v1/* 的 API key：设了之后面板里改不了，适合不希望被运行时改动的部署。
      # 不设则首次启动自动生成，可在面板轮换。
      # API_KEY: "sk-gemini-your-key"
      TZ: "${TZ:-UTC}"

    command:
      - "--db"
      - "/data/gemini.db"
      - "--port"
      - "8083"
      # 挂了 cookie 就把下面两行打开
      # - "--cookie-file"
      # - "/app/cookie.txt"

    healthcheck:
      test: ["CMD", "/app/gemini-web2api", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
